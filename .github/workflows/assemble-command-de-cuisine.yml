name: Assemble Command de Cuisine base

on:
  push:
    branches: [command-de-cuisine-base]
    paths:
      - '.github/cdc-decode-trigger'

permissions:
  contents: write

jobs:
  assemble:
    if: github.event.head_commit.message == 'Assemble Command de Cuisine base'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: command-de-cuisine-base
          fetch-depth: 0
      - name: Rebuild uploaded base exactly
        shell: bash
        run: |
          set -euo pipefail
          cat .github/cdc_chunks/*.b64 | base64 -d | gzip -d > index.html
          printf '%s  %s\n' '51ef5d49ee7f2d5bf37ca5e017360872048dd8012f57291c9b845cb78f5fdb5f' 'index.html' | sha256sum -c -
          rm -rf .github/cdc_chunks
          rm -f .github/cdc-decode-trigger
          rm -f .github/workflows/assemble-command-de-cuisine.yml
      - name: Commit rebuilt base
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Build Command de Cuisine base'
          git push origin HEAD:command-de-cuisine-base
