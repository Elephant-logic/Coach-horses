name: Assemble Command de Cuisine base

on:
  push:
    branches: [command-de-cuisine-base]
    paths:
      - '.github/cdc-decode-trigger'
  pull_request:
    branches: [main]
    paths:
      - '.github/cdc-decode-trigger'

permissions:
  contents: write

jobs:
  assemble:
    if: github.event_name == 'pull_request' || github.event.head_commit.message == 'Assemble Command de Cuisine base'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: command-de-cuisine-base
          fetch-depth: 0
      - name: Verify staged chunks
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            e03a7d19c260578ae6ab789dd21f808510640142 .github/cdc_chunks/part01.b64 \
            6c8138f63779a335791b90239e514c16ff91cac2 .github/cdc_chunks/part02.b64 \
            ac8203fd3338f86306247fc93baf3cb2f7490963 .github/cdc_chunks/part03.b64 \
            c00b4d1b1da49c218e2f0fa4367855a9eb868fa9 .github/cdc_chunks/part04.b64 \
            91a20376297cfb14acf020964f6de37fdc6ba984 .github/cdc_chunks/part05.b64 \
            7b28d279bd722c84412fc81fdc0377296f531f5a .github/cdc_chunks/part06.b64 \
            b2252cca3c3035115f28c84d803f46522b06088b .github/cdc_chunks/part07.b64 \
            70492b470ae92f59b9ea1502dfdd29f9b9c71655 .github/cdc_chunks/part08.b64 \
            eb074485b6e085ee7740a195e59354961bf4b6cc .github/cdc_chunks/part09.b64 \
            4a95a95d480f6c72bbc1c8c756825ea16ac72da6 .github/cdc_chunks/part10.b64 \
            8c38cd1be502a98265e479d13e47d791efac343d .github/cdc_chunks/part11.b64 \
            8f7d486c343536299cde3308d7bb1b5e2b2efb12 .github/cdc_chunks/part12.b64 \
            c2a1ca769da2dcad174c11cf04bd61f5c533d00f .github/cdc_chunks/part13.b64 | while read expected file; do
              actual=$(git hash-object "$file")
              echo "$file $actual"
              test "$actual" = "$expected"
            done
      - name: Rebuild uploaded base exactly
        shell: bash
        run: |
          set -euo pipefail
          cat .github/cdc_chunks/*.b64 | base64 -d | gzip -d > index.html
          printf '%s  %s\n' '51ef5d49ee7f2d5bf37ca5e017360872048dd8012f57291c9b845cb78f5fdb5f' 'index.html' | sha256sum -c -
          rm -rf .github/cdc_chunks
          rm -f .github/cdc-decode-trigger
          rm -f .github/workflows/assemble-command-de-cuisine.yml
      - name: Commit rebuilt base
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Build Command de Cuisine base'
          git push origin HEAD:command-de-cuisine-base
