# Triggered through a merge so GitHub Actions receives a normal main-branch push.
name: Consolidate kitchen runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/consolidate-runtime.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build one controlled browser runtime
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          active = [
              'delivery_patch.js',
              'ai_server_patch.js',
              'compliance_patch.js',
              'login_cleanup_patch.js',
              'recipe_management_patch.js',
              'clockin_session_patch.js',
              'ai_recipe_save_patch.js',
              'ai_ideas_variety_patch.js',
              'recipe_category_patch.js',
              'menu_photo_complete_import_patch.js',
              'kitchen_workflow_stable.js',
              'global_kitchen_assistant_tabs.js',
              'settings_pro_patch.js',
          ]

          missing = [name for name in active if not Path(name).exists()]
          if missing:
              raise SystemExit('Missing active runtime files: ' + ', '.join(missing))

          parts = [
              '/* Coach & Horses Kitchen Pro — generated controlled runtime. */',
              '/* Source order is deliberate. Edit source modules, then rebuild this file. */',
          ]
          for name in active:
              parts.append('\n/* ===== ' + name + ' ===== */\n')
              parts.append(Path(name).read_text(encoding='utf-8').rstrip())
          Path('app_bundle.js').write_text('\n'.join(parts) + '\n', encoding='utf-8')

          server = Path('server.py').read_text(encoding='utf-8')
          server = re.sub(
              r"\s*scripts = \(.*?\n\s*\)\n\s*if '/[^']+' not in raw:",
              "\n            scripts = '<script src=\"/app_bundle.js?v=1\"></script>'\n            if '/app_bundle.js' not in raw:",
              server,
              count=1,
              flags=re.S,
          )
          server = re.sub(
              r"\s*patch_files = \(.*?\n\s*\)\n\s*if path in patch_files:",
              "\n        patch_files = ('/app_bundle.js',)\n        if path in patch_files:",
              server,
              count=1,
              flags=re.S,
          )
          if "'/app_bundle.js'" not in server or 'app_bundle.js?v=1' not in server:
              raise SystemExit('server.py consolidation did not apply safely')
          Path('server.py').write_text(server, encoding='utf-8')

          dead = [
              'global_kitchen_assistant.js',
              'menu_prep_workflow_patch.js',
              'menu_actions_repair_patch.js',
              'menu_prep_zero_stock_patch.js',
              'menu_builder_patch.js',
              'menu_recipe_selector_fix.js',
              'menu_import_status_patch.js',
              'menus_recipes_prep_restore.js',
              'menu_optional_dessert_patch.js',
              'order_quantity_truth_patch.js',
              'menu_owned_recipes_patch.js',
              'prep_create_button_fix.js',
              'menu_photo_import_patch.js',
              'prep_delete_patch.js',
              'prep_menu_upload_patch.js',
              'prep_nav_repair_patch.js',
              'prep_safe_patch.js',
              'recipe_menu_patch.js',
              'recipe_quantity_autofill_patch.js',
              'recipe_seed_patch.js',
              'recipe_seed_v2_patch.js',
              'recipe_viewer_patch.js',
              'single_dish_cleanup_patch.js',
              'ui_flow_cleanup_patch.js',
          ]
          for name in dead:
              Path(name).unlink(missing_ok=True)
          PY

      - name: Validate consolidated build
        shell: bash
        run: |
          python -m py_compile app.py server.py startup_history.py
          node --check app_bundle.js
          grep -q 'python server.py' render.yaml
          grep -q '/app_bundle.js' server.py

      - name: Commit consolidation
        shell: bash
        run: |
          git config user.name 'Coach Horses Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No runtime changes required.'
          else
            git commit -m 'Consolidate active kitchen runtime'
            git push origin HEAD:main
          fi
