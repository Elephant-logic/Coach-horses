name: Release check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python syntax
        run: python -m py_compile app.py server.py startup_history.py
      - name: JavaScript syntax
        shell: bash
        run: |
          set -e
          for f in *.js; do
            echo "Checking $f"
            node --check "$f"
          done
      - name: Runtime wiring
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          loader=Path('runtime_loader.js').read_text()
          server=Path('server.py').read_text()
          required=['delivery_patch.js','ai_server_patch.js','compliance_patch.js','login_cleanup_patch.js','recipe_management_patch.js','clockin_session_patch.js','ai_recipe_save_patch.js','ai_ideas_variety_patch.js','recipe_category_patch.js','menu_photo_complete_import_patch.js','kitchen_workflow_stable.js','prep_v2.js','global_kitchen_assistant_tabs.js','settings_pro_patch.js']
          for f in required:
              assert Path(f).exists(), f'missing {f}'
              assert f in loader, f'{f} not loaded'
              assert ('/'+f) in server, f'{f} not served'
          assert loader.index('prep_v2.js') < loader.index('global_kitchen_assistant_tabs.js')
          assert 'runtime_loader.js' in server
          assert 'python server.py' in Path('render.yaml').read_text()
          print('runtime wiring OK')
          PY
      - name: Prep V2 contract
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          p=Path('prep_v2.js').read_text()
          checks=['state.prepLists','prepV2Date','prepV2Covers','data-prep-assignee','data-prep-complete','data-prep-stock','downloadCsv','getPrepV2Context','applyPrepAICommand','VIEWS.prep=renderPrep','VIEWS.prepLists=renderPrep']
          for needle in checks: assert needle in p, f'missing Prep V2 contract: {needle}'
          print('prep contract OK')
          PY
      - name: Login isolation and AI contract
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          a=Path('global_kitchen_assistant_tabs.js').read_text()
          checks=['typeof me','document.getElementById(\'app\')','document.getElementById(\'login\')','getPrepV2Context','/api/openai/responses','applyPrepAICommand','max_output_tokens:900']
          for needle in checks: assert needle in a, f'missing assistant contract: {needle}'
          assert "'\"':'&quot;'" in a, 'HTML quote escaping is broken'
          print('assistant contract OK')
          PY
      - name: Security and persistence contract
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          app=Path('app.py').read_text()
          checks=['HttpOnly; Secure','SameSite=Lax','expected_revision','conflict','OPENAI_API_KEY','payload["store"] = False','MAX_STATE_BYTES']
          for needle in checks: assert needle in app, f'missing server contract: {needle}'
          print('security/persistence contract OK')
          PY
