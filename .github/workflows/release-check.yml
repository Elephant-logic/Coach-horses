name: Release check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python syntax
        run: python -m py_compile app.py server.py startup_history.py
      - name: JavaScript syntax
        shell: bash
        run: |
          set -e
          for f in *.js; do
            echo "Checking $f"
            node --check "$f"
          done
      - name: Runtime wiring
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          import re
          loader=Path('runtime_loader.js').read_text()
          server=Path('server.py').read_text()
          required=['delivery_patch.js','ai_server_patch.js','compliance_patch.js','login_cleanup_patch.js','recipe_management_patch.js','clockin_session_patch.js','ai_recipe_save_patch.js','ai_ideas_variety_patch.js','recipe_category_patch.js','menu_photo_complete_import_patch.js','kitchen_workflow_stable.js','prep_v2.js','global_kitchen_assistant_tabs.js','settings_pro_patch.js']
          for f in required:
              assert Path(f).exists(), f'missing {f}'
              assert f in loader, f'{f} not loaded'
              assert ('/'+f) in server, f'{f} not served'
          assert loader.index('prep_v2.js') < loader.index('global_kitchen_assistant_tabs.js'), 'Prep V2 must load before contextual AI'
          assert 'runtime_loader.js' in server
          assert 'python server.py' in Path('render.yaml').read_text()
          print('runtime wiring OK')
          PY
      - name: Prep V2 contract
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          p=Path('prep_v2.js').read_text()
          checks={
            'saved prep state':'state.prepLists',
            'date field':'prepV2Date',
            'covers field':'prepV2Covers',
            'assignments':'data-prep-assignee',
            'completion':'data-prep-complete',
            'stock':'data-prep-stock',
            'csv':'downloadOrderCsv',
            'AI context':'getPrepV2Context',
            'AI actions':'applyPrepAICommand',
            'primary prep route':'VIEWS.prep=renderPrep',
          }
          for name,needle in checks.items():
              assert needle in p, f'missing {name}: {needle}'
          assert ('VIEWS.prepLists=renderPrep' in p or 'VIEWS.preplists=renderPrep' in p), 'no alternate prep route takeover'
          print('prep contract OK')
          PY
      - name: Login isolation and AI contract
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          a=Path('global_kitchen_assistant_tabs.js').read_text()
          assert 'loggedIn()' in a
          assert 'loginForm' in a
          assert 'getPrepV2Context' in a
          assert '/api/openai/responses' in a
          assert 'applyPrepAICommand' in a
          print('assistant contract OK')
          PY
