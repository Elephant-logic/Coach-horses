name: Stabilise Command de Cuisine

on:
  push:
    branches: [stabilise-command-de-cuisine]
    paths:
      - '.github/cdc-stabilise-trigger'

permissions:
  contents: write

jobs:
  stabilise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilise-command-de-cuisine
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply stabilisation
        run: python tools/stabilise_command_de_cuisine.py
      - name: Check embedded JavaScript syntax
        shell: bash
        run: |
          python - <<'PY' > /tmp/cdc.js
          from pathlib import Path
          s=Path('index.html').read_text()
          a=s.index('<script>')+len('<script>')
          b=s.rindex('</script>')
          print(s[a:b])
          PY
          node --check /tmp/cdc.js
      - name: Verify behaviour contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          required=[
            'amCount+"/"+coldUnits.length+" units"',
            'pmCount+"/"+coldUnits.length+" units"',
            'tempTab="round";rerender();',
            'WiFi sensors are not connected yet — no reading was recorded',
            'the app will never invent a live reading',
            'Array.isArray(s.dailyChecks)',
          ]
          for needle in required:
              assert needle in s, needle
          assert 'tempTab="history";rerender();' not in s
          print('Command de Cuisine stabilisation contracts OK')
          PY
      - name: Commit stabilised base
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/cdc-stabilise-trigger
          rm -f .github/workflows/stabilise-command-de-cuisine.yml
          rm -f tools/stabilise_command_de_cuisine.py
          git add -A
          git commit -m 'Stabilise Command de Cuisine core workflows'
          git push origin HEAD:stabilise-command-de-cuisine
