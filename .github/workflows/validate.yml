name: Validate kitchen app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python syntax
        run: python -m py_compile app.py server.py startup_history.py auth_controls.py logout_control.py ai_guard.py
      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in *.js; do node --check "$f"; done
          python - <<'PY' > /tmp/command-de-cuisine.js
          from pathlib import Path
          s=Path('index.html').read_text()
          a=s.index('<script>')+len('<script>')
          b=s.rindex('</script>')
          print(s[a:b])
          PY
          node --check /tmp/command-de-cuisine.js
      - name: Command de Cuisine contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          server=Path('server.py').read_text()
          app=Path('app.py').read_text()
          enh=Path('command_de_cuisine_enhancements.js').read_text()
          fixes=Path('kitchen_fixes_20260810.js').read_text()
          multi=Path('multi_page_menu_import.js').read_text()
          detailed=Path('detailed_menu_recipes.js').read_text()
          reliable=Path('reliable_menu_import.js').read_text()
          quality=Path('recipe_quality_upgrade.js').read_text()
          costing=Path('recipe_costing_fix.js').read_text()
          accounts=Path('account_controls.js').read_text()
          logout_ui=Path('logout_controls.js').read_text()
          logout_server=Path('logout_control.py').read_text()
          core=Path('core_workflow_stability.js').read_text()
          auth=Path('auth_controls.py').read_text()
          ai=Path('ai_guard.py').read_text()

          for needle in [
              'Command de Cuisine — The Coach &amp; Horses',
              'VIEWS.pass=function', 'VIEWS.temps=function', 'VIEWS.checks=function',
              'VIEWS.prep=function', 'VIEWS.cooking=function', 'VIEWS.cleaning=function',
              'VIEWS.stock=function', 'VIEWS.reports=function',
              'Array.isArray(s.dailyChecks)', 'amCount+"/"+coldUnits.length+" units"',
              'pmCount+"/"+coldUnits.length+" units"', 'tempTab="round";rerender();',
              'WiFi sensors are not connected yet — no reading was recorded',
              'the app will never invent a live reading',
          ]:
              assert needle in html, f'missing Command de Cuisine contract: {needle}'

          for needle in ["chefNav.label='Chef AI'", "placeholder:'Ask Chef anything, or type a command…'", "handleCommand(text)", "VIEWS.history=function", "Historic register plus everything recorded in the current app", "normaliseHistoryState", "dailyCheckHistory"]:
              assert needle in enh, f'missing enhancement contract: {needle}'

          for needle in [
              "weekCompliance=function()", "Fill missed temperature round", "source:'manager-backfill'",
              "Temperature record coverage — last 7 days", "accept:'image/*,.jpg,.jpeg,.png,.webp,.heic,.heif'",
              "Never say records are complete when the context says readings/checks are missing", "Missing temperature rounds:",
          ]:
              assert needle in fixes, f'missing kitchen fix contract: {needle}'

          for needle in ["multiple:true", "photos.push(...loaded)", "aiExtractMenu({images:photos.map(p=>p.data)})"]:
              assert needle in multi, f'missing multi-page menu contract: {needle}'

          for needle in ["commitImportedMenu=function", "persistPromise", "needsReview=true", "Imported recipe drafts"]:
              assert needle in detailed, f'missing detailed recipe contract: {needle}'

          for needle in [
              "model='gpt-4.1-mini'", 'Read this ONE page of a pub food menu', 'detectOnePage',
              'for(let i=0;i<pages.length;i++)', 'for(let start=0;start<dishes.length;start+=5)',
              'if(result&&result.persistPromise)await result.persistPromise',
              "Save menu & recipes", "Each page will be read separately for accuracy",
          ]:
              assert needle in reliable, f'missing reliable importer contract: {needle}'

          for needle in [
              'FULL start-to-finish commercial kitchen recipe specifications',
              'Use printed menu headings and physical placement as the strongest evidence',
              '8–16 clear numbered actionable steps', 'Improve imported recipe drafts',
              "recipeQuality:'full-draft'", 'reclassifyExisting',
          ]:
              assert needle in quality, f'missing recipe quality contract: {needle}'

          for needle in [
              'Estimate ROUGH UK trade ingredient cost', 'estimatedLineCost', 'Food cost £ / portion',
              'Not linked to stock', 'Estimate rough food cost', "r.cost=money(d.estimatedFoodCost)",
              "r.price=menuPrice",
          ]:
              assert needle in costing, f'missing recipe costing contract: {needle}'

          for needle in ["VIEWS.account=function", "Change my password", "/api/password/change", "/api/users/manage", "ME.role!=='manager'", "Reset password", "Final control"]:
              assert needle in accounts, f'missing account UI contract: {needle}'

          for needle in ["Log out", "/api/logout", "window.location.replace('/')", "stays signed in for up to 12 hours"]:
              assert needle in logout_ui, f'missing logout UI contract: {needle}'
          for needle in ["Max-Age=0", "Expires=Thu, 01 Jan 1970 00:00:00 GMT", "authenticated\": False"]:
              assert needle in logout_server, f'missing logout server contract: {needle}'

          for needle in [
              'One detection pass + one full recipe pass only', 'PRINTED SECTION HEADING',
              'for(let start=0;start<dishes.length;start+=3)', 'AI batch timed out', 'retrying once',
              'commitImportedMenu=function', 'speechSynthesis', 'SpeechSynthesisUtterance',
              'STATE.settings.speak!==false', 'Read answers aloud', 'synth.cancel()',
              'aiReplyDepth>0', 'allowSpeech!==false'
          ]:
              assert needle in core, f'missing consolidated workflow contract: {needle}'

          for needle in [
              "def _append_only_preserved", 'Existing {label} history is append-only',
              '("tempReadings", "temperature")', '("audit", "audit")',
              "user.pop(\"password\", None)", "def change_password", "def manage_user",
              "Manager access required.", "There must always be at least one active manager.",
              "incoming[\"users\"] = current[\"state\"].get(\"users\", [])",
              "incoming[\"settings\"] = current[\"state\"].get(\"settings\", {})"
          ]:
              assert needle in auth, f'missing auth/compliance control: {needle}'

          for needle in [
              'ALLOWED_MODELS = {"gpt-4o-mini", "gpt-4.1-mini"}',
              'MAX_AI_REQUEST_BYTES', 'RATE_LIMIT = 90', 'RATE_WINDOW_SECONDS = 10 * 60',
              'payload["store"] = False', 'Too many AI requests', 'That AI model is not allowed'
          ]:
              assert needle in ai, f'missing AI proxy guard: {needle}'

          assert 'tempTab="history";rerender();' not in html, 'temperature save must stay on the round'
          assert 'raw = harden_legacy_login(raw)' not in server, 'legacy front-end injection must stay disabled'
          injected=server.split("if path == '/':",1)[1].split('data = raw.encode',1)[0]
          assert '/runtime_loader.js' not in injected, 'runtime loader must not be injected into the new base'
          assert '/menu_import_stability.js' not in injected, 'old menu stability wrapper must not be injected'
          assert '/assistant_tts_fix.js' not in injected, 'old TTS wrapper must not be injected'
          for path in ['/command_de_cuisine_enhancements.js','/kitchen_fixes_20260810.js','/multi_page_menu_import.js','/detailed_menu_recipes.js','/reliable_menu_import.js','/recipe_quality_upgrade.js','/recipe_costing_fix.js','/account_controls.js','/logout_controls.js','/manager_ai_temp_backfill.js','/core_workflow_stability.js']:
              assert path in server, f'{path} must be loaded'
          assert server.index('/reliable_menu_import.js?v=20260812c') > server.index('/detailed_menu_recipes.js?v=20260812c'), 'reliable importer must load after detailed recipe override'
          assert server.index('/recipe_quality_upgrade.js?v=20260812c') > server.index('/reliable_menu_import.js?v=20260812c'), 'recipe quality controls must load after reliable importer'
          assert server.index('/core_workflow_stability.js?v=20260812c') > server.index('/manager_ai_temp_backfill.js?v=20260812c'), 'consolidated workflow owner must load last'
          assert "path == '/api/session'" in server and "auth_controls.send_session" in server
          assert "path == '/api/logout'" in server and 'logout_control.logout(self)' in server
          assert "path == '/api/openai/responses'" in server and 'ai_guard.handle(self)' in server
          assert "'/api/login', '/api/password/change', '/api/users/manage'" in server
          assert 'auth_controls.save_state' in server
          assert 'python server.py' in Path('render.yaml').read_text()

          for needle in ['HttpOnly; Secure','SameSite=Lax','expected_revision','conflict','OPENAI_API_KEY','payload["store"] = False','MAX_STATE_BYTES']:
              assert needle in app, f'missing server contract: {needle}'
          print('Command de Cuisine validation OK')
          PY
